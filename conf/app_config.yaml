logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: atguigu
  password: ${DB_META_PASSWORD}
  database: meta

db_dw:
  host: localhost
  port: 3306
  user: atguigu
  password: ${DB_DW_PASSWORD}
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: ${EMBEDDING_API_KEY}
  model: "text-embedding-v2"

es:
  host: localhost
  port: 9200
  index_name: data_agent

llm_coder:
  model_name: qwen-coder-plus-latest
  api_key: ${LLM_CODER_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

llm_text:
  model_name: qwen3-max
  api_key: ${LLM_TEXT_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
